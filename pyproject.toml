[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k3etcd"
version = "0.2.0"
description = "Python client for the etcd v2 API, for etcd server 2.3.x to 3.5.x"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zhang Yanpo", email = "drdr.xp@gmail.com" }
]
keywords = ["etcd", "client", "distributed", "key-value"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "k3http>=0.1.6",
    "k3utfjson",
]

[project.urls]
Homepage = "https://github.com/pykit3/k3etcd"
Documentation = "https://k3etcd.readthedocs.io"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "coverage",
    "k3ut",
    "k3utdocker",
    "k3utfjson",
    "trustme",
]
publish = [
    "build",
    "twine",
    "pk3",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

[tool.setuptools]
packages = ["k3etcd"]

[tool.setuptools.package-dir]
k3etcd = "."

[tool.ruff]
line-length = 120
